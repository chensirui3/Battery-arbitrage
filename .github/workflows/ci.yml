name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A run takes a few minutes; without a limit, a hang runs until GitHub's 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # With the dashboard extra, the dashboard's own smoke test runs instead of being skipped.
      - name: Install
        run: python -m pip install -e ".[dev,dashboard]"
      - name: Lint
        run: |
          ruff check src tests dashboard scripts
          ruff format --check src tests dashboard scripts
      - name: Test
        run: pytest
